services:
  postgres:
    image: postgres:17
    container_name: opspulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: opspulse
      POSTGRES_PASSWORD: opspulse_dev_password
      POSTGRES_DB: opspulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opspulse -d opspulse"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: